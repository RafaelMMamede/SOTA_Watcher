sources: [openalex, ieee, scopus, arxiv]
search_terms_path: search_terms.yaml
# null exhausts configured searches; use 3 for a smoke test (reported incomplete).
max_results_per_query: null
from_publication_date: '2023-01-01'
to_publication_date: '2026-09-24'
mailto: your_email@example.com
sleep_seconds: 1.0
source_options:
  openalex:
    page_size: 100
  ieee:
    page_size: 200
  scopus:
    view: STANDARD
    page_size: 200
  arxiv:
    sleep_seconds: 3.0
    # OAI harvests all subjects and filters titles/abstracts locally.
    # A historical backfill can be large. null exhausts the harvest window.
    max_pages: null
    # For recurring UPDATE monitoring only, explicitly set oai_from_date and
    # oai_until_date. Do not substitute publication cutoffs for these fields.
output_dir: output
sota_table_path: output/sota_table.xlsx
discovery_log_dir: output/discovery_runs
save_raw_responses: true
review_summary_path: output/review_summary.md
screening:
  # Enable after reviewing eligibility criteria and testing local Ollama.
  enabled: false
  model: qwen3.5:9b
  base_url: http://localhost:11434
  think: false
  num_ctx: 32768
  num_predict: 2048
  timeout_seconds: 300
  max_papers_per_run: null
  papers_dir: output/papers
  refresh_pdf: false
  force: false
# Map exact paper_id (preferred) or DOI from the table to a local PDF path.
local_pdfs: {}
# Example:
# local_pdfs:
#   'scopus:123456': '/absolute/path/paper.pdf'
