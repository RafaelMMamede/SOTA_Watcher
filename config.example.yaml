sources: [openalex, ieee, scopus, arxiv]
search_terms_path: search_terms.yaml
# null exhausts configured searches; use 3 for a smoke test (reported incomplete).
max_results_per_query: null
from_publication_date: '2023-01-01'
to_publication_date: '2026-09-24'
mailto: your_email@example.com
sleep_seconds: 1.0
source_options:
  openalex:
    page_size: 100
  ieee:
    page_size: 200
  scopus:
    view: STANDARD
    page_size: 200
    # Prefer cursor pagination; auto falls back to offset if rejected.
    pagination_mode: auto
    # Conservative offset request size for accounts with lower service limits.
    offset_page_size: 25
  arxiv:
    sleep_seconds: 3.0
    # OAI harvests all subjects and filters titles/abstracts locally.
    # A historical backfill can be large. null exhausts the harvest window.
    max_pages: null
    # For recurring UPDATE monitoring only, explicitly set oai_from_date and
    # oai_until_date. Do not substitute publication cutoffs for these fields.
output_dir: output
# SQLite is the authoritative working state; Excel is import/export/review UI.
corpus_db_path: output/sota_corpus.sqlite3
sota_table_path: output/sota_table.xlsx
discovery_log_dir: output/discovery_runs
save_raw_responses: true
review_summary_path: output/review_summary.md

# Full-text resolution is independent of discovery source.
# Only resolver-verified open PDFs are downloaded automatically.
fulltext_resolution:
  enabled: true
  openalex: true
  unpaywall: true
  semantic_scholar: true
  crossref_metadata: true
  allow_title_fallback: true
  timeout_seconds: 20
  max_retries: 2

candidate_selection:
  # Deterministic gate before title/abstract screening.
  # Potential core papers are always protected. For established contextual
  # literature, rank separately within publication year x search stream.
  enabled: true
  historical_start_year: 2020
  historical_through_year: 2024
  recent_from_year: 2025
  top_n_per_year_per_stream: 50
  # Recent non-core papers are too new for stable citation ranking. Keep them
  # only when a merged venue value matches this pre-specified whitelist.
  # Core-protected papers bypass this filter. Missing recent venue metadata is
  # kept unresolved rather than silently excluded.
  recent_venue_filter:
    enabled: true
    venues:
      - name: CVPR
        aliases:
          - CVPR
          - Conference on Computer Vision and Pattern Recognition
      - name: ICCV
        aliases:
          - ICCV
          - International Conference on Computer Vision
      - name: ECCV
        aliases:
          - ECCV
          - European Conference on Computer Vision
      - name: ACM MM
        aliases:
          - ACM MM
          - ACM Multimedia
          - ACM International Conference on Multimedia
      - name: WACV
        aliases:
          - WACV
          - Winter Conference on Applications of Computer Vision
          - IEEE/CVF Winter Conference on Applications of Computer Vision
      - name: BMVC
        aliases:
          - BMVC
          - British Machine Vision Conference
      - name: NeurIPS
        aliases:
          - NeurIPS
          - Neural Information Processing Systems
      - name: ICML
        aliases:
          - ICML
          - International Conference on Machine Learning
      - name: ICLR
        aliases:
          - ICLR
          - International Conference on Learning Representations
      - name: AAAI
        aliases:
          - AAAI
          - AAAI Conference on Artificial Intelligence
      - name: IJCAI
        aliases:
          - IJCAI
          - International Joint Conference on Artificial Intelligence
      - name: IEEE S&P
        aliases:
          - IEEE Symposium on Security and Privacy
      - name: USENIX Security
        aliases:
          - USENIX Security
          - USENIX Security Symposium
      - name: ACM CCS
        aliases:
          - ACM CCS
          - ACM Conference on Computer and Communications Security
      - name: NDSS
        aliases:
          - NDSS
          - Network and Distributed System Security Symposium
      - name: TPAMI
        aliases:
          - TPAMI
          - IEEE Transactions on Pattern Analysis and Machine Intelligence
      - name: IJCV
        aliases:
          - IJCV
          - International Journal of Computer Vision
      - name: TIFS
        aliases:
          - TIFS
          - IEEE Transactions on Information Forensics and Security
  # Include all papers tied with the Nth paper rather than breaking citation ties.
  include_ties: true
  # A paper retrieved by both search families is treated as a potential core paper.
  protect_both_streams: true
  # Also protect title/abstract records that contain both deepfake/forgery and
  # adversarial/robustness concepts.
  protect_core_keywords: true
  # Current corpus citation_count is the maximum observed provider count.
  citation_metric: merged_max_provider_citation_count
  manifest_dir: output/candidate_selection

metadata_screening:
  # Standalone title/abstract screening is run with:
  #   python sota_watcher.py screen-metadata --limit N
  # It is intentionally high recall: uncertain records advance to full text.
  # When true, only records selected by candidate_selection are queued.
  require_candidate_selection: true
  model: qwen3.5:9b
  base_url: http://localhost:11434
  num_ctx: 8192
  fast_num_predict: 1200
  fallback_enabled: true
  fallback_think: low
  fallback_num_predict: 3072
  # Only used when the reasoning fallback exhausts its output budget.
  repair_num_predict: 1600
  timeout_seconds: 180
  max_papers_per_run: null
  artifacts_dir: output/metadata_screening
  force: false

screening:
  # Enable after reviewing eligibility criteria and testing local Ollama.
  enabled: false
  model: qwen3.5:9b
  base_url: http://localhost:11434
  num_ctx: 32768
  # Fast path: no thinking, explicit JSON schema in the prompt, strict local validation.
  fast_num_predict: 2048
  # If the fast pass is invalid, retry once with structured low-thinking output.
  fallback_enabled: true
  fallback_think: low
  fallback_num_predict: 8192
  # If the reasoning fallback hits done_reason=length, split that chunk and retry.
  max_split_depth: 6
  # Legacy aliases remain accepted: think, num_predict,
  # repair_invalid_output, and repair_num_predict.
  timeout_seconds: 300
  max_papers_per_run: null
  # By default, only metadata include/uncertain records reach PDF retrieval.
  require_metadata_screening: true
  papers_dir: output/papers
  # Re-query OA resolvers even if resolution.json exists.
  refresh_resolution: false
  refresh_pdf: false
  force: false
# Map exact paper_id (preferred) or DOI from the table to a local PDF path.
local_pdfs: {}
# Example:
# local_pdfs:
#   'scopus:123456': '/absolute/path/paper.pdf'
