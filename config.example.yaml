sources: [openalex, ieee, scopus, arxiv]
search_terms_path: search_terms.yaml
# null exhausts configured searches; use 3 for a smoke test (reported incomplete).
max_results_per_query: null
from_publication_date: '2023-01-01'
to_publication_date: '2026-09-24'
mailto: your_email@example.com
sleep_seconds: 1.0
source_options:
  openalex:
    page_size: 100
  ieee:
    page_size: 200
  scopus:
    view: STANDARD
    page_size: 200
    # Prefer cursor pagination; auto falls back to offset if rejected.
    pagination_mode: auto
    # Conservative offset request size for accounts with lower service limits.
    offset_page_size: 25
  arxiv:
    sleep_seconds: 3.0
    # OAI harvests all subjects and filters titles/abstracts locally.
    # A historical backfill can be large. null exhausts the harvest window.
    max_pages: null
    # For recurring UPDATE monitoring only, explicitly set oai_from_date and
    # oai_until_date. Do not substitute publication cutoffs for these fields.
output_dir: output
# SQLite is the authoritative working state; Excel is import/export/review UI.
corpus_db_path: output/sota_corpus.sqlite3
sota_table_path: output/sota_table.xlsx
discovery_log_dir: output/discovery_runs
save_raw_responses: true
review_summary_path: output/review_summary.md

# Full-text resolution is independent of discovery source.
# Only resolver-verified open PDFs are downloaded automatically.
fulltext_resolution:
  enabled: true
  openalex: true
  unpaywall: true
  semantic_scholar: true
  crossref_metadata: true
  allow_title_fallback: true
  timeout_seconds: 20
  max_retries: 2

metadata_screening:
  # Standalone title/abstract screening is run with:
  #   python sota_watcher.py screen-metadata --limit N
  # It is intentionally high recall: uncertain records advance to full text.
  model: qwen3.5:9b
  base_url: http://localhost:11434
  num_ctx: 8192
  fast_num_predict: 1200
  fallback_enabled: true
  fallback_think: low
  fallback_num_predict: 3072
  timeout_seconds: 180
  max_papers_per_run: null
  artifacts_dir: output/metadata_screening
  force: false

screening:
  # Enable after reviewing eligibility criteria and testing local Ollama.
  enabled: false
  model: qwen3.5:9b
  base_url: http://localhost:11434
  num_ctx: 32768
  # Fast path: no thinking, explicit JSON schema in the prompt, strict local validation.
  fast_num_predict: 2048
  # If the fast pass is invalid, retry once with structured low-thinking output.
  fallback_enabled: true
  fallback_think: low
  fallback_num_predict: 8192
  # If the reasoning fallback hits done_reason=length, split that chunk and retry.
  max_split_depth: 6
  # Legacy aliases remain accepted: think, num_predict,
  # repair_invalid_output, and repair_num_predict.
  timeout_seconds: 300
  max_papers_per_run: null
  # By default, only metadata include/uncertain records reach PDF retrieval.
  require_metadata_screening: true
  papers_dir: output/papers
  # Re-query OA resolvers even if resolution.json exists.
  refresh_resolution: false
  refresh_pdf: false
  force: false
# Map exact paper_id (preferred) or DOI from the table to a local PDF path.
local_pdfs: {}
# Example:
# local_pdfs:
#   'scopus:123456': '/absolute/path/paper.pdf'
